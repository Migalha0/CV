    <!-- Apply the theme before first paint so dark mode doesn't flash light -->
    <script>
      try {
        var saved = localStorage.getItem("theme");
        var dark = saved
          ? saved === "dark"
          : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {}
    </script>
